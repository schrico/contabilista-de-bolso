# Verificações em cada pull request e em cada push na main.
# O build e o deploy para a Azure entram aqui na Fase 5 do Bloco 0.
name: verificacoes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSAO: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o gitleaks varre o histórico todo

      - uses: astral-sh/setup-uv@v7

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes
        run: uv run pytest

      - name: Verificar NIF e IBAN em todos os ficheiros versionados
        run: uv run python -m ferramentas.verificar_dados_pessoais --todos

      - name: Gitleaks sobre o histórico
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check
          tar -xzf "$arquivo" gitleaks
          ./gitleaks git --redact --verbose .
